# Local prod smoke-test — mirrors docker-compose.prod.yml but with:
#   - Local builds instead of GHCR images
#   - ./.secrets/ env file paths instead of /opt/teacupboutique/.secrets/
#   - Gateway exposed directly on 8080 instead of nginx (no cert needed)
#
# Usage:
#   docker compose -f docker-compose.prod.local.yml up --build

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"   # management UI for local debugging
    volumes:
      - rabbitmq-prod-local-data:/var/lib/rabbitmq
    restart: unless-stopped

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
    env_file:
      - ./.secrets/postgres-auth.env
    volumes:
      - postgres-auth-prod-local-data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-inventory:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventorydb
    env_file:
      - ./.secrets/postgres-inventory.env
    volumes:
      - postgres-inventory-prod-local-data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-orders:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ordersdb
    env_file:
      - ./.secrets/postgres-orders.env
    volumes:
      - postgres-orders-prod-local-data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-payments:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentsdb
    env_file:
      - ./.secrets/postgres-payments.env
    volumes:
      - postgres-payments-prod-local-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Services ─────────────────────────────────────────────────────────────────

  auth:
    build:
      context: .
      dockerfile: src/services/auth/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMq__Host=rabbitmq
      - ClientUrl=http://localhost:5173
    env_file:
      - ./.secrets/auth.env
    depends_on:
      - postgres-auth
      - rabbitmq
    restart: unless-stopped

  inventory:
    build:
      context: .
      dockerfile: src/services/inventory/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMq__Host=rabbitmq
    env_file:
      - ./.secrets/inventory.env
    depends_on:
      - postgres-inventory
      - rabbitmq
    restart: unless-stopped

  orders:
    build:
      context: .
      dockerfile: src/services/orders/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMq__Host=rabbitmq
    env_file:
      - ./.secrets/orders.env
    depends_on:
      - postgres-orders
      - rabbitmq
    restart: unless-stopped

  payments:
    build:
      context: .
      dockerfile: src/services/payments/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMq__Host=rabbitmq
    env_file:
      - ./.secrets/payments.env
    depends_on:
      - postgres-payments
      - rabbitmq
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: src/services/notifications/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
      - RabbitMq__Host=rabbitmq
      - FrontendUrl=http://localhost:5173
    env_file:
      - ./.secrets/notifications.env
    depends_on:
      - rabbitmq
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - Cors__AllowedOrigins=http://localhost:5173,http://localhost:3000
    env_file:
      - ./.secrets/gateway.env
    ports:
      - "5054:8080"
    depends_on:
      - auth
      - inventory
      - orders
      - payments
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: src/client/Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  rabbitmq-prod-local-data:
  postgres-auth-prod-local-data:
  postgres-inventory-prod-local-data:
  postgres-orders-prod-local-data:
  postgres-payments-prod-local-data:
