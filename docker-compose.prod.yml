# Production stack — single file, run with:
#   docker compose -f docker-compose.prod.yml up -d

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
    env_file:
      - /opt/teacupboutique/.secrets/postgres-auth.env
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-inventory:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventorydb
    env_file:
      - /opt/teacupboutique/.secrets/postgres-inventory.env
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-orders:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ordersdb
    env_file:
      - /opt/teacupboutique/.secrets/postgres-orders.env
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-payments:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paymentsdb
    env_file:
      - /opt/teacupboutique/.secrets/postgres-payments.env
    volumes:
      - postgres-payments-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Services ─────────────────────────────────────────────────────────────────

  auth:
    image: ghcr.io/lbirchenough/teacupboutique-auth:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMq__Host=rabbitmq
      - ClientUrl=https://teacupboutique.lbirchen.com
    env_file:
      - /opt/teacupboutique/.secrets/auth.env
    depends_on:
      - postgres-auth
      - rabbitmq
    restart: unless-stopped

  inventory:
    image: ghcr.io/lbirchenough/teacupboutique-inventory:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMq__Host=rabbitmq
    env_file:
      - /opt/teacupboutique/.secrets/inventory.env
    depends_on:
      - postgres-inventory
      - rabbitmq
    restart: unless-stopped

  orders:
    image: ghcr.io/lbirchenough/teacupboutique-orders:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMq__Host=rabbitmq
    env_file:
      - /opt/teacupboutique/.secrets/orders.env
    depends_on:
      - postgres-orders
      - rabbitmq
    restart: unless-stopped

  payments:
    image: ghcr.io/lbirchenough/teacupboutique-payments:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - RabbitMq__Host=rabbitmq
    env_file:
      - /opt/teacupboutique/.secrets/payments.env
    depends_on:
      - postgres-payments
      - rabbitmq
    restart: unless-stopped

  notifications:
    image: ghcr.io/lbirchenough/teacupboutique-notifications:latest
    environment:
      - DOTNET_ENVIRONMENT=Production
      - RabbitMq__Host=rabbitmq
      - FrontendUrl=https://teacupboutique.lbirchen.com
      - Mailgun__Domain=mg.teacupboutique.lbirchen.com
      - Mailgun__FromAddress=noreply@mg.teacupboutique.lbirchen.com
      - Mailgun__FromName=Teacup Boutique
    env_file:
      - /opt/teacupboutique/.secrets/notifications.env
    depends_on:
      - rabbitmq
    restart: unless-stopped

  gateway:
    image: ghcr.io/lbirchenough/teacupboutique-gateway:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - Cors__AllowedOrigins=https://teacupboutique.lbirchen.com
    env_file:
      - /opt/teacupboutique/.secrets/gateway.env
    depends_on:
      - auth
      - inventory
      - orders
      - payments
    restart: unless-stopped

  client:
    image: ghcr.io/lbirchenough/teacupboutique-client:latest
    restart: unless-stopped

  # ── Edge ─────────────────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/teacupboutique/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/teacupboutique/.secrets/cloudflare-origin.crt:/etc/nginx/certs/cloudflare-origin.crt:ro
      - /opt/teacupboutique/.secrets/cloudflare-origin.key:/etc/nginx/certs/cloudflare-origin.key:ro
    depends_on:
      - gateway
      - client
    restart: unless-stopped

volumes:
  rabbitmq-data:
  postgres-auth-data:
  postgres-inventory-data:
  postgres-orders-data:
  postgres-payments-data:
